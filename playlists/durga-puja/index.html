<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maa Asche 🪔 Durga Puja Playlist</title>
<link rel="stylesheet" href="../../assets/shared/base.css?v=2" />
<link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <h1 class="hero-title">🪔 Maa Asche 🪔</h1>
  <p class="hero-subtitle">Dhaak er awaaz, shiuli phool, r ek mon bhora anondo — she's home!</p>

  <div class="now-playing-card">
    <div class="page-title">Durga Puja</div>
    <div class="now-playing-label">Now Playing</div>

    <img id="song-art" class="album-art" src="" alt="Album art" />
    <h2 id="song-title" class="song-title">Loading...</h2>
    <p id="song-artist" class="song-artist"></p>

    <p id="quote" class="quote"></p>

    <div class="controls">
      <button id="prev" aria-label="Previous song">⏮</button>
      <button id="play-pause" aria-label="Play or pause">▶</button>
      <button id="next" aria-label="Next song">⏭</button>
    </div>

    <div id="yt-player"></div>

    <a class="back-link" href="../../">← Back to Music Hub</a>
  </div>

  <script src="songs.js?v=2"></script>
  <script src="quotes.js?v=2"></script>
  <script src="../../assets/shared/player.js?v=2"></script>
  <script>
    const player = new MusicPlayer({
      songs: SONGS,
      quotes: QUOTES,
      els: {
        title: document.getElementById('song-title'),
        artist: document.getElementById('song-artist'),
        art: document.getElementById('song-art'),
        quote: document.getElementById('quote'),
        playPauseBtn: document.getElementById('play-pause'),
        prevBtn: document.getElementById('prev'),
        nextBtn: document.getElementById('next'),
        playerContainer: document.getElementById('yt-player'),
      },
    });
  </script>
</body>
</html>
